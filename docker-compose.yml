services:
  mysql:
    image: mysql:8.4
    container_name: interviewai-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: interviewai
      MYSQL_USER: interviewai
      MYSQL_PASSWORD: interviewai
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - interviewai_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  interviewai_mysql:
